---
- name: Ensure audit tools are installed
  ansible.builtin.package:
    name: audit
    state: present

- name: "Install execution rules for both architectures - {{ rhel9_stig_audit_control }}"
  ansible.builtin.lineinfile:
    path: /etc/audit/rules.d/30-rhel9-stig.rules
    line: >-
      -a always,exit -F arch={{ item }} -F path=/usr/bin/{{ rhel9_stig_audit_program }} -F perm=x -k identity
    create: true
    owner: root
    group: root
    mode: '0640'
    backup: true
  loop:
    - b32
    - b64
  notify: Augenrules_reload

- name: "Remove the superseded architecture-neutral rule - {{ rhel9_stig_audit_control }}"
  ansible.builtin.lineinfile:
    path: /etc/audit/rules.d/30-rhel9-stig.rules
    regexp: '^-a always,exit -F path=/usr/bin/{{ rhel9_stig_audit_program }} -F perm=x -k identity$'
    state: absent
    backup: true
  notify: Augenrules_reload

- name: "Inspect loaded audit rules - {{ rhel9_stig_audit_control }}"
  ansible.builtin.command: auditctl -l
  register: rhel9_stig_loaded_audit_rules
  changed_when: false
  check_mode: false

- name: "Request activation when runtime rules are missing - {{ rhel9_stig_audit_control }}"
  vars:
    rhel9_stig_audit_pattern: >-
      {{ '(?m)^-a always,exit -F arch=' ~ item ~ '(?: -S \S+)? -F path=/usr/bin/'
         ~ rhel9_stig_audit_program ~ ' -F perm=x -F key=identity' ~ '$' }}
  ansible.builtin.debug:
    msg: "Checking {{ item }} execution auditing for {{ rhel9_stig_audit_program }}"
  changed_when: rhel9_stig_loaded_audit_rules.stdout is not search(rhel9_stig_audit_pattern)
  loop:
    - b32
    - b64
  notify: Augenrules_reload

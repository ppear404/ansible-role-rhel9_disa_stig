name: Validate role
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhel9_disa_stig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rhel9_disa_stig
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
      - name: Validate source without connecting to managed systems
        run: |
          ansible-playbook -i tests/inventory tests/test.yml --syntax-check
          ansible-playbook -i tests/inventory tests/evaluate.yml --syntax-check
          ansible-playbook -i tests/inventory tests/full-assessment.yml --syntax-check
          ansible-playbook -i tests/inventory tests/prepare-evaluator.yml --syntax-check
          ansible-lint --offline tasks handlers defaults vars meta tests/*.yml inventory/group_vars.example.yml
          python -m py_compile files/firewall_validate.py tests/summarize_evaluation.py tests/check_public_content.py
          python tests/check_public_content.py
